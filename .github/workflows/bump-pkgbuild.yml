name: Bump PKGBUILD on new Positron release

on:
  schedule:
    - cron: '0 3 */1 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-pkgbuild
  cancel-in-progress: false

env:
  BASE_BRANCH: master

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.compare.outputs.has_update }}
      new_pkgver_url: ${{ steps.latest.outputs.tag }}
      new_pkgver: ${{ steps.latest.outputs.pkgver }}
    steps:
      - uses: actions/checkout@v7

      - name: Get latest positron release tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/posit-dev/positron/releases/latest --jq .tag_name)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "pkgver=${tag//-/.}" >> "$GITHUB_OUTPUT"

      - name: Compare against current PKGBUILD
        id: compare
        run: |
          set -euo pipefail
          current=$(grep -Po '^pkgver_url=\K.*' PKGBUILD)
          if [ "$current" = "${{ steps.latest.outputs.tag }}" ]; then
            echo "PKGBUILD already at ${current}, nothing to do."
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release ${{ steps.latest.outputs.tag }} (current: ${current})"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          fi

  bump-pkgbuild:
    needs: check-release
    if: needs.check-release.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.push.outputs.branch }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch developer-provided checksums
        id: checksums
        env:
          TAG: ${{ needs.check-release.outputs.new_pkgver_url }}
        run: |
          set -euo pipefail
          url="https://cdn.posit.co/positron/releases/checksums/positron-${TAG}-checksums.json"
          json=$(curl -fsSL "$url")
          x64=$(jq -r --arg k "Positron-${TAG}-x64.deb" '.[$k] // empty' <<< "$json")
          arm64=$(jq -r --arg k "Positron-${TAG}-arm64.deb" '.[$k] // empty' <<< "$json")
          if [ -z "$x64" ] || [ -z "$arm64" ]; then
            echo "::error::missing x64/arm64 .deb checksum entries for ${TAG} in ${url}"
            exit 1
          fi
          echo "x64=${x64}" >> "$GITHUB_OUTPUT"
          echo "arm64=${arm64}" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD
        env:
          NEW_PKGVER: ${{ needs.check-release.outputs.new_pkgver }}
          NEW_PKGVER_URL: ${{ needs.check-release.outputs.new_pkgver_url }}
          SHA_X64: ${{ steps.checksums.outputs.x64 }}
          SHA_ARM64: ${{ steps.checksums.outputs.arm64 }}
        run: |
          set -euo pipefail
          sed -i "s/^pkgver=.*/pkgver=${NEW_PKGVER}/" PKGBUILD
          sed -i "s/^pkgver_url=.*/pkgver_url=${NEW_PKGVER_URL}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA_X64}')/" PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${SHA_ARM64}')/" PKGBUILD

      - name: Regenerate .SRCINFO
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/repo:ro" -w /repo archlinux:base-devel bash -c '
            set -euo pipefail
            useradd -m builder
            cp /repo/PKGBUILD /home/builder/PKGBUILD
            chown builder:builder /home/builder/PKGBUILD
            cd /home/builder && su builder -c "makepkg --printsrcinfo"
          ' > .SRCINFO

      - name: Commit and push bump branch
        id: push
        env:
          NEW_PKGVER: ${{ needs.check-release.outputs.new_pkgver }}
        run: |
          set -euo pipefail
          branch="bump-${NEW_PKGVER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add PKGBUILD .SRCINFO
          git commit -m "bump version to ${NEW_PKGVER}"
          git push --force origin "${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

  validate-x86_64:
    needs: [check-release, bump-pkgbuild]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-pkgbuild.outputs.branch }}

      - name: makepkg (x86_64)
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg --nodeps --noconfirm"

  validate-aarch64:
    needs: [check-release, bump-pkgbuild]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      CARCH: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-pkgbuild.outputs.branch }}

      - name: makepkg (aarch64, foreign-arch dry run)
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder .
          su builder -c "CARCH=aarch64 makepkg --nodeps --noconfirm"

  finalise:
    needs: [check-release, bump-pkgbuild, validate-x86_64, validate-aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Open and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.bump-pkgbuild.outputs.branch }}
          NEW_PKGVER: ${{ needs.check-release.outputs.new_pkgver }}
        run: |
          set -euo pipefail
          gh pr create \
            --title "bump version to ${NEW_PKGVER}" \
            --body "Automated bump to Positron ${NEW_PKGVER}. Verified developer-provided sha256 checksums and a \`makepkg\` package() dry run for both x86_64 and aarch64." \
            --base "${BASE_BRANCH}" \
            --head "${BRANCH}"
          gh pr merge "${BRANCH}" --squash --delete-branch --admin

  publish-aur:
    needs: finalise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_ed25519
          chmod 600 ~/.ssh/aur_ed25519
          cat >> ~/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          aur.archlinux.org ssh-rsa 
          EOF
          chmod 600 ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_ed25519 -o IdentitiesOnly=yes"

          aur_url="ssh://aur@aur.archlinux.org/positron-ide-devel-bin.git"

          # AUR rejects any pushed commit whose tree contains subdirectories
          # (e.g. .github/), so build a flat commit with only the package
          # files instead of pushing this repo's full HEAD. commit-tree
          # needs the parent object locally, so fetch it (not ls-remote).
          aur_parent=""
          if git fetch "$aur_url" "refs/heads/${BASE_BRANCH}"; then
            aur_parent=$(git rev-parse FETCH_HEAD)
          fi

          tmp_index="$(mktemp -u)"
          GIT_INDEX_FILE="$tmp_index" git add -- .SRCINFO PKGBUILD .gitignore README.md
          tree=$(GIT_INDEX_FILE="$tmp_index" git write-tree)
          rm -f "$tmp_index"

          parent_args=()
          if [ -n "$aur_parent" ]; then
            parent_args=(-p "$aur_parent")
          fi
          commit=$(git commit-tree "$tree" "${parent_args[@]}" -m "$(git log -1 --format=%s)")

          git push "$aur_url" "${commit}:refs/heads/${BASE_BRANCH}"
